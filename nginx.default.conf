server {
    listen       80;
    server_name  localhost;
    client_max_body_size   50m;
    root /usr/share/nginx/html/ng-alain-v19-without-ssr/browser;
    index index.html;
    #charset koi8-r;
    #access_log  /var/log/nginx/host.access.log  main;
     
    location = /index.html {
        add_header Cache-Control 'no-store' always;
        try_files $uri =404;
    }

    # Hashed build assets are immutable. Missing assets must never become index.html.
    location ~* "^/(?:.*/)?[^/]+-[A-Z0-9]{8,}\.(?:js|mjs|css)$" {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable';
        error_page 404 = @missing_asset;
    }

    location ~* \.(?:js|mjs|css|json|map)$ {
        try_files $uri =404;
        add_header Cache-Control 'no-cache';
        error_page 404 = @missing_asset;
    }

    location @missing_asset {
        add_header Cache-Control 'no-store' always;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }


    location ^~ /api/ {
        
        # proxy_read_timeout 120;
        # proxy_connect_timeout 120;
        # proxy_send_timeout 120;

        # proxy_pass http://zuulserver:5555/api/;
        proxy_pass http://apigateway:5555/api/;
    }

    location ^~ /adminer/ {
        # proxy_pass http://zuulserver:5555/api/;
        
        # resolver server.example.invalid valid=60s ipv6=off; 
        # resolver 127.0.0.1 valid=30s ipv6=off;
        # set $proxy_url "zuulserver";
        # proxy_pass http://$proxy_url:5555/api/;
        
        # only when the zuul server and web client are installed in the same VM
        # 1. kubernetes the same node
        # 2. ECS the same task definition
        proxy_pass http://adminer:8080;
    }
    
    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}
