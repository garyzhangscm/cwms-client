<div class="handoff-locations">
  <h2>External System Handoff Locations</h2>
  <p>Select WMEC locations used to hand inventory over to the external shipping system. Saving this list does not adjust inventory or start a schedule.</p>
  <nz-card nzTitle="Handoff Locations">
    <nz-spin [nzSpinning]="loading">
      <div class="location-picker">
        <input nz-input [(ngModel)]="query" placeholder="Search location name, e.g. out"
          (keyup.enter)="search()" [disabled]="saving" />
        <button nz-button nzType="default" (click)="search()" [nzLoading]="searching" [disabled]="saving">Search</button>
        <nz-select [(ngModel)]="selectedId" nzPlaceHolder="Select a location" [nzDisabled]="saving">
          <nz-option *ngFor="let option of options" [nzValue]="option.id"
            [nzLabel]="option.name + ' (#' + option.id + ')'"
            [nzDisabled]="isSelected(option.id)"></nz-option>
        </nz-select>
        <button nz-button nzType="default" (click)="add()" [disabled]="selectedId === null || saving">Add</button>
      </div>
      <nz-table [nzData]="locations" [nzShowPagination]="false" nzSize="middle">
        <thead><tr><th>Location</th><th>MES ID</th><th>Action</th></tr></thead>
        <tbody>
          <tr *ngFor="let location of locations">
            <td>{{ location.name }}</td>
            <td>{{ location.id }}</td>
            <td><button nz-button nzDanger nzType="default" (click)="remove(location.id)"
              [disabled]="saving">Remove</button></td>
          </tr>
        </tbody>
      </nz-table>
      <div class="actions">
        <button nz-button nzType="primary" (click)="save()" [nzLoading]="saving" [disabled]="loading">Save Locations</button>
        <button nz-button nzType="default" (click)="load()" [disabled]="loading || saving">Reload</button>
      </div>
    </nz-spin>
  </nz-card>
</div>
